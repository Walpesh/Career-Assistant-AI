[project]
name = "career-assistant-ai"
version = "0.1.0"
description = "Career-Assistant-AI — парсинг и анализ вакансий hh.ru, LLM-письма (Modular-Flow, docs/01)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
  "python-multipart==0.0.32",
  "sqlalchemy[asyncio]==2.1.1",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "redis==5.3.1",
  "hiredis==3.4.2",
  "arq==0.28.0",
  "python-jose[cryptography]==3.5.0",
  "bcrypt==5.0.0",
  "httpx==0.28.1",
  "curl-cffi==0.16.3",
  "playwright==1.63.0",
  "playwright-stealth==2.0.3",
  "patchright==1.63.0",
  "nodriver==0.50.3",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "sentry-sdk==2.71.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.16.9",
  "mypy==1.18.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE"]
ignore = ["E501", "BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
