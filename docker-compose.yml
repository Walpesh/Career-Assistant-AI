# Production orchestration: postgres:16, redis:7, api, worker-parsing (×N),
# worker-llm (СТРОГО ×1), ollama, frontend (nginx).
# docs/01 §6: LLM Worker — строго 1 concurrent worker (single replica).
name: career-assistant-ai

x-common-env: &common-env
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://career:${POSTGRES_PASSWORD:-career}@postgres:5432/${POSTGRES_DB:-career_assistant}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars) in environment or .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8080}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-api,localhost,frontend}
  QUEUE_EMBEDDED_WORKERS: "false"
  QUEUE_RECOVER_ON_STARTUP: "true"
  # Observability (docs/01 §9): JSON-логи, Prometheus-метрики, Sentry.
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON_OUTPUT: "true"
  METRICS_ENABLED: "true"
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  ALERT_LLM_QUEUE_PENDING_THRESHOLD: ${ALERT_LLM_QUEUE_PENDING_THRESHOLD:-10}
  ALERT_CAPTCHA_RATE_THRESHOLD: ${ALERT_CAPTCHA_RATE_THRESHOLD:-0.05}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career}
      POSTGRES_DB: ${POSTGRES_DB:-career_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-career} -d $${POSTGRES_DB:-career_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Prometheus scrape target: GET http://<host>:8000/metrics (docs/01 §9).
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker-parsing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *common-env
    # Scalable to N replicas: docker compose up --scale worker-parsing=3
    deploy:
      replicas: ${PARSING_REPLICAS:-2}
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "arq --help >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Graceful shutdown: SIGTERM → активные job'ы завершаются/deferred.
    stop_grace_period: 65s
    command: ["python", "worker_entry.py", "parsing"]

  worker-llm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      <<: *common-env
    # STRICTLY 1 single replica: 1-concurrent-worker limit (docs/01 §5, docs/05 §1).
    # НЕ масштабировать: второй экземпляр = параллельные запросы к Ollama.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "arq --help >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 130s
    command: ["python", "worker_entry.py", "llm"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  pgdata:
  redisdata:
  ollama:
