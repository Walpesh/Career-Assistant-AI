# Frontend behind nginx: static SPA + reverse proxy to api (/api/, /ws docs/03 §8).
upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Security headers (дополняют backend SecurityHeadersMiddleware).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: статика + fallback на index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API (docs/03_API_CONTRACTS.md) → FastAPI.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health для внешнего мониторинга (liveness без зависимостей).
    location /health {
        proxy_pass http://api;
    }
    location /health/live {
        proxy_pass http://api;
    }
    location /health/ready {
        proxy_pass http://api;
    }

    # WebSocket Realtime Module (docs/03 §8) → FastAPI.
    location /api/v1/ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
