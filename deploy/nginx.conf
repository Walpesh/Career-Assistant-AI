# Frontend behind nginx: static SPA + reverse proxy to api (/api/, /ws docs/03 §8).
#
# Отвечает также за production- hardening фронтенда:
#   - строгая CSP без 'unsafe-inline' в script-src, nonce на инлайн-скрипты;
#   - Cache-Control: no-cache для HTML, immutable для content-hashed шрифтов;
#   - SRI/редиректы не трогаются — хэши проставлены в разметке (frontend/tools).
upstream api {
    server api:8000;
}

# Cache-Control по типу ресурса (docs/01 §10).
#
# Два важных решения реализации:
#
# 1) Значение берётся из map, а не задаётся через add_header внутри location.
#    add_header в location-блоке ПОЛНОСТЬЮ заменяет унаследованные от server
#    заголовки — вместе с CSP и X-Frame-Options. Поэтому единственный
#    add_header Cache-Control живёт в server, а map решает, что подставить.
#
# 2) Пустое значение означает «не добавлять заголовок вообще»: так
#    проксированные ответы API (/api/, /health, WebSocket) остаются
#    без Cache-Control и не получают чужих политик кэширования.
map $uri $cache_control {
    # --- Прокси: заголовок не выставляем (кэширование решает backend) ---
    default           "";
    "~^/api(/|$)"     "";
    "~^/health(/|$)"  "";
    "~^/metrics(/|$)" "";

    # --- Точки входа SPA ---
    # `no-cache` = можно хранить в кэше, но обязательно перепроверить у сервера
    # (ответ 304, а не полная загрузка). Иначе пользователь после деплоя
    # долго получал бы ссылку на предыдущую сборку styles.min.css.
    "/index.html"     "no-cache";
    "/404.html"       "no-cache";
    "/"               "no-cache";

    # --- Content-hashed статика ---
    # Имя файла содержит хэш содержимого, поэтому файл неизменяем:
    # год в кэше без риска «залипания» старой версии.
    "~^/fonts/.+\.[0-9a-f]{8}\.woff2$"   "public, max-age=31536000, immutable";

    # --- Остальная статика (js/, partials/, assets/) ---
    # Имена не хэшированные: максимум — перепроверка (304) при каждом заходе.
    "~^/(js|partials|assets|css)/"       "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;

    # Security headers (дополняют backend SecurityHeadersMiddleware).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # CSP уровня «строгий» (без 'unsafe-inline'/'unsafe-eval' в script-src).
    #
    #   default-src  'self'         — всё по умолчанию только со своего origin;
    #   script-src   'self' 'nonce-…' — внешние модули из js/ + инлайн с nonce;
    #   style-src    'self'           — стили только из собранного styles.min.css
    #                                   (раньше требовался 'unsafe-inline' ради
    #                                   <style type="text/tailwindcss"> и Google Fonts);
    #   font-src     'self'           — Inter self-hosted (152-ФЗ / GDPR);
    #   connect-src  'self' ws: wss:  — REST + WebSocket реал-тайма (docs/03 §8).
    #
    # Nonce берётся из $request_id — nginx генерирует 32 hex-символа на каждый
    # запрос (ngx_http_core, входит в стандартную сборку). Это исключает
    # 'unsafe-inline' из script-src: без совпадения nonce браузер не выполнит
    # ни один инлайн-скрипт. Разметка содержит плейсхолдер __CSP_NONCE__,
    # который подставляется здесь (см. sub_filter ниже).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    # Подстановка nonce в HTML. sub_filter требует текстового ответа без gzip,
    # поэтому gzip для HTML отключается ниже (для статики он остаётся).
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' '$request_id';


    # gzip_types НЕ включает text/html — это обязательное условие работы
    # sub_filter выше: он ищет плейсхолдер в несжатом теле ответа.
    # Стили и скрипты по-прежнему сжимаются.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache-Control подставляется из map $uri (см. выше): no-cache для HTML,
    # immutable для content-hashed шрифтов.
    add_header Cache-Control $cache_control always;

    root /usr/share/nginx/html;
    index index.html;

    # Кастомная страница 404 вместо стандартной nginx.
    error_page 404 /404.html;

    # SPA-fallback: неизвестный путь без расширения отдаёт index.html,
    # чтобы работали прямые ссылки на вкладки.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запрос с расширением (.js/.css/.woff2/.svg) — это статика, а не маршрут.
    # Отдавать для неё index.html нельзя: браузер попытается выполнить HTML
    # как JavaScript. Такие запросы обязаны давать честный 404.
    #
    # Префикс /api/ исключён явно: /api/v1/....json — это ответ backend,
    # и он не должен попадать в файловый location (иначе проксирование
    # перестанет работать для таких маршрутов).
    location ~* ^/(?!api/|health/|metrics/).*\.(?:js|css|woff2|svg|png|jpe?g|webp|ico|json|map)$ {
        try_files $uri =404;
    }

    # REST API (docs/03_API_CONTRACTS.md) → FastAPI.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health для внешнего мониторинга (liveness без зависимостей).
    location /health {
        proxy_pass http://api;
    }
    location /health/live {
        proxy_pass http://api;
    }
    location /health/ready {
        proxy_pass http://api;
    }

    # --- Правовые и служебные файлы (TASK «Legal Documentation») ---
    # RFC 9116 требует отдавать security.txt по пути /.well-known/security.txt
    # с типом text/plain. Здесь он отдаётся напрямую с диска: кодировка
    # объявлена явно, потому что без неё nginx отдаёт его как octet-stream,
    # и часть инструментов проверки отвергает файл по MIME-типу.
    location = /.well-known/security.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # robots.txt и статика правовых страниц (/legal/*.html).
    # Cache-Control не переопределяется: значения берутся из map $uri,
    # чтобы не потерять унаследованные от server security-заголовки.
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    location ~* ^/(legal)/.+\.html$ {
        try_files $uri =404;
    }

    # WebSocket Realtime Module (docs/03 §8) → FastAPI.
    location /api/v1/ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
